name: Build BlackEye APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Individua cartella progetto
        id: detect
        run: |
          SETTINGS_PATH=$(find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -n "$SETTINGS_PATH" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_PATH")
            echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
            echo "Progetto rilevato in: $PROJECT_DIR"
            exit 0
          fi

          APP_GRADLE_PATH=$(find . -maxdepth 4 \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) | head -n 1)
          if [ -n "$APP_GRADLE_PATH" ]; then
            APP_DIR=$(dirname "$APP_GRADLE_PATH")
            PROJECT_DIR=$(dirname "$APP_DIR")
            echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
            echo "Cartella app rilevata in: $PROJECT_DIR"
            exit 0
          fi

          echo "ERRORE: Nessun progetto Android trovato."
          exit 1

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configura Android SDK (pre-installato)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "PATH=/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Installa componenti SDK 34
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Prepara Gradle Wrapper e file base
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          mkdir -p gradle/wrapper
          curl -fL "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          curl -fL "https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew" -o gradlew
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          else
            sed -i 's/\r$//' gradle/wrapper/gradle-wrapper.properties
          fi

          if [ ! -f "gradle.properties" ]; then
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          else
            sed -i 's/\r$//' gradle.properties
          fi

      - name: Compila APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: java -Dorg.gradle.appname=gradlew -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug --no-daemon --stacktrace

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackEye-debug-apk
          path: ${{ steps.detect.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
