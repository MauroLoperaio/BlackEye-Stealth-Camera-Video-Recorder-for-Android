name: Build BlackEye APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Individua cartella progetto
        id: detect
        run: |
          if [ -f "StealthCam/settings.gradle" ]; then
            echo "dir=StealthCam" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configura Android SDK (pre-installato)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "PATH=/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Installa componenti SDK 34
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Prepara Gradle Wrapper e proprietà
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          mkdir -p gradle/wrapper
          curl -fL "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          if [ ! -f "gradlew" ]; then
            curl -fLo gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew"
          fi
          chmod +x gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi

          if [ ! -f "gradle.properties" ]; then
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          fi

      - name: Compila APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackEye-debug-apk
          path: ${{ steps.detect.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
