name: Build StealthCam APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

defaults:
  run:
    working-directory: StealthCam

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Scarica Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -fL "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar

      - name: Scarica gradlew ufficiale
        run: curl -fLo gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew" && chmod +x gradlew

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Accetta licenze e installa SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compila APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: StealthCam-debug-apk
          path: StealthCam/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
